[package]
name = "kura-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
kurasql = { path = "../kurasql" }
kura-chain = { path = "../kura-chain" }
kura-query = { path = "../kura-query" }
alloy = { version = "1", features = ["full"] }
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
sqlparser = "0.41"
